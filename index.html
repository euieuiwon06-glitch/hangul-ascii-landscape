<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 풍경</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* UI 글꼴: SUIT Thin (배경·동물 글자는 Noto Sans KR 그대로) */
  @font-face { font-family: 'SUIT'; font-weight: 100; font-display: swap;
               src: url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/static/woff2/SUIT-Thin.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 400; font-display: swap;
               src: url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/static/woff2/SUIT-Regular.woff2') format('woff2'); }
  :root { --ink: #111; --ui: 'SUIT', 'Noto Sans KR', sans-serif; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: var(--ui); font-weight: 100; color: var(--ink); }
  button { font: inherit; color: inherit; }
  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%;
               opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; }
  #stage svg.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  body.over-animal #stage { cursor: grab; }
  body.dragging, body.dragging #stage { cursor: grabbing; }

  /* 아래: 입력창 + ANIMALS 버튼 */
  .dock { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 5;
          display: flex; gap: 8px; align-items: center; transition: opacity .2s ease; }
  body.dragging .dock { opacity: .3; pointer-events: none; }
  .pill { display: flex; align-items: center; border-radius: 999px; height: 34px; box-sizing: border-box;
          background: rgba(255,255,255,.9); box-shadow: 0 1px 10px rgba(0,0,0,.1); font-size: 13px; }
  form.pill { width: min(220px, calc(100vw - 150px)); padding: 0 14px; }
  form input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0;
               font: 400 13px/1 var(--ui); color: #111; text-align: center; }   /* 입력창만 SUIT Regular */
  form input::placeholder { color: #999; }
  #listBtn { border: 0; padding: 0 14px 0 16px; gap: 7px; cursor: pointer; white-space: nowrap;
             font: 100 12px/1 var(--ui); letter-spacing: .02em; }
  #listBtn svg { width: 9px; height: 9px; flex: none; }
  #listBtn:hover { background: #fff; }
  #msg { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
         max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 999px;
         background: rgba(255,255,255,.9); font-size: 12px; line-height: 1.4; color: #444;
         text-align: center; pointer-events: none; }
  #msg:empty { display: none; }

  /* 오른쪽 위: 배경 고르기(점 지구본, 검정) */
  /* 지구본은 배경 글자 자체(zoo.js) — 이 버튼은 그 위의 보이지 않는 누르는 영역 */
  #globe { position: fixed; z-index: 30; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
  #globe:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

  /* 배경 고르기: 흐린 바탕 + 좌우로 넘기는 카드 (닫기 = 빈 곳 누르기 · Esc) */
  #scenes { position: fixed; inset: 0; z-index: 20; overflow: hidden; touch-action: none; user-select: none;
            background: rgba(30,26,24,.06);
            backdrop-filter: blur(18px) saturate(1.05); -webkit-backdrop-filter: blur(18px) saturate(1.05);
            opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  #scenes.open { opacity: 1; pointer-events: auto; }
  #track { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .card { position: absolute; left: 0; top: 0; width: var(--cw); aspect-ratio: 1280 / 717; border: 0; padding: 0;
          border-radius: 18px; overflow: hidden; cursor: pointer; background: #fff;
          box-shadow: 0 10px 40px rgba(0,0,0,.14); transition: transform .45s cubic-bezier(.2,.7,.2,1), filter .45s; }
  .card img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .card.side { filter: brightness(.9); }
  #scenes.dragging .card { transition: none; }

  /* 동물 목록 — letter-zoo 팝업과 같은 구성(입력창 바로 위 유리 패널) */
  #intro { position: fixed; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-end;
           padding: 16px 16px 70px; box-sizing: border-box;
           opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  #intro.open { opacity: 1; pointer-events: auto; }
  .panel { position: relative; container-type: inline-size;
           width: min(1180px, 92vw, calc((100vh - 110px) / .52));
           padding: 1.3cqw 0 3.6cqw; border-radius: 4.2cqw;
           background: rgba(255,255,255,.06);
           -webkit-backdrop-filter: blur(5px) saturate(1.05); backdrop-filter: blur(5px) saturate(1.05);
           box-shadow: 0 30px 70px -45px rgba(20,40,30,.5);
           color: var(--ink); text-align: center;
           transform: translateY(10px) scale(.985); transition: transform .45s cubic-bezier(.22,1,.36,1); }
  #intro.open .panel { transform: none; }
  .panel h2 { font: 100 3.05cqw/1.15 var(--ui); margin: .3cqw 8cqw 0; }
  .panel .x { position: absolute; top: 1.9cqw; right: 3.6cqw; width: 4.4cqw; height: 4.4cqw;
              display: grid; place-items: center; border: 0; background: none; color: var(--ink);
              cursor: pointer; border-radius: 50%; }
  .panel .x svg { width: 2.9cqw; height: 2.9cqw; }
  .grid { width: 82.8cqw; margin: 4.6cqw auto 0; display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 5cqw; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .75cqw;
          border: 0; background: none; padding: 0; cursor: pointer; }
  .tile .ic { height: 6.4cqw; display: flex; align-items: flex-end; }
  .tile svg { display: block; fill: var(--ink); stroke: var(--ink); }
  .tile b { font: 100 1.5cqw/1 var(--ui); letter-spacing: .02em; }
  .tile:hover .ic { transform: translateY(-2px); transition: transform .2s; }
  @media (max-width: 700px) {
    .panel { width: 92vw; padding: 5cqw 4cqw 4cqw; border-radius: 7cqw; }
    .panel h2 { font-size: 6cqw; margin: 0 9cqw 5cqw; }
    .panel .x { top: 3.5cqw; right: 4cqw; width: 9cqw; height: 9cqw; }
    .panel .x svg { width: 6cqw; height: 6cqw; }
    .grid { width: auto; margin: 0; grid-template-columns: repeat(3, 1fr); row-gap: 8cqw; }
    .tile .ic { height: auto; }
    .tile { gap: 1.6cqw; }
    .tile b { font-size: 3.3cqw; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="동물을 놓을 초원"></div>

<button id="globe" aria-label="배경 고르기" aria-haspopup="dialog"></button>

<div id="msg" aria-live="polite"></div>
<div class="dock">
  <form id="ask" class="pill" autocomplete="off">
    <input id="name" placeholder="이름을 입력하세요" aria-label="동물 이름" spellcheck="false" enterkeyhint="go">
  </form>
  <button id="listBtn" class="pill" aria-haspopup="dialog">동물 목록
    <svg viewBox="5.9 5.9 12.2 12.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
  </button>
</div>

<div id="scenes" role="dialog" aria-modal="true" aria-label="배경 고르기">
  <div id="track"></div>
</div>

<div id="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="panel">
    <button class="x" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
    <h2 id="introTitle">동물 이름을 입력하고 엔터를 누르세요</h2>
    <div class="grid"></div>
  </div>
</div>

<script src="scenes.js?v=202611152316"></script>
<script src="animals.js?v=202611152316"></script>
<script src="sil.js?v=202611152316"></script>
<script src="zoo.js?v=202611152316"></script>
<script src="ui.js?v=202611152316"></script>
</body>
</html>
