<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 풍경</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%;
               opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; }
  #stage svg.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  body.over-animal #stage { cursor: grab; }
  body.dragging, body.dragging #stage { cursor: grabbing; }
  /* 끄는 동안엔 입력창이 땅을 가리지 않게 흐리게 + 통과 */
  form.pill { transition: opacity .2s ease; }
  body.dragging form.pill { opacity: .3; pointer-events: none; }

  .pill { position: fixed; left: 50%; transform: translateX(-50%);
          display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
          background: rgba(255,255,255,.9); box-shadow: 0 1px 10px rgba(0,0,0,.1);
          font: 13px/1 'Noto Sans KR', sans-serif; color: #333; }
  nav.pill { top: 20px; }
  nav button { border: 0; background: none; padding: 10px 16px; border-radius: 999px;
               color: #333; cursor: pointer; font: inherit; }
  nav button:hover { background: rgba(0,0,0,.06); }
  nav #next { background: #111; color: #fff; }
  nav #next:hover { background: #333; }
  nav #count { min-width: 64px; text-align: center; color: #555; font-variant-numeric: tabular-nums; }

  form.pill { bottom: 20px; width: min(220px, calc(100vw - 32px)); box-sizing: border-box; padding: 2px 14px; }
  form input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0;
               font: 13px/1 'Noto Sans KR', sans-serif; color: #111; text-align: center; }
  form input::placeholder { color: #999; }
  #msg { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
         max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 999px;
         background: rgba(255,255,255,.9); font: 12px/1.4 'Noto Sans KR', sans-serif; color: #444;
         text-align: center; pointer-events: none; }
  #msg:empty { display: none; }
</style>
</head>
<body>
<div id="stage" aria-label="동물을 놓을 초원"></div>
<nav class="pill" aria-label="장면 넘기기">
  <button id="prev" aria-label="이전 장">← 이전</button>
  <span id="count" aria-live="polite">01 / 02</span>
  <button id="next" aria-label="다음 장">다음 →</button>
</nav>
<div id="msg" aria-live="polite"></div>
<form id="ask" class="pill" autocomplete="off">
  <input id="name" placeholder="이름을 입력하세요" aria-label="동물 이름" spellcheck="false" enterkeyhint="go">
</form>
<script src="scenes.js?v=202611152236"></script>
<script src="animals.js?v=202611152236"></script>
<script src="zoo.js?v=202611152236"></script>
</body>
</html>
